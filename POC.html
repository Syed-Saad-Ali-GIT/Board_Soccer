	else if(x.ctr[l]){log('↩️ Counter attack!');ann({t:'fx',e:'↩️',txt:'Counter attack!'});move(l,1)}
	else{const n=Math.max(x.thr[w]?2:1,x.mv[w]);if(n>1)ann({t:'fx',e:'🎯',txt:`Ball moves ${n} spaces!`});move(w,n);if(S.phase!='over'&&x.dr[w])draw(w);if(x.so[w])S.noDraw[l]=1}}}
	S.rv=v.slice();S.rt=L[L.length-1].replace(/<[^>]+>/g,'');
	for(let i=0;i<2;i++){if(S.red[i]>0)S.red[i]--;if(S.redN[i]){S.red[i]=S.redN[i];S.redN[i]=0}}
	if(S.phase!=='over')S.phase='roll';draw_()}
	async function done(i){if(S.phase!=='cards'||S.act)return;if(NET.g){NET.send({a:'card',i});return}if(S.mp)return mpAct(0,i);stopTimer();S.phase='busy';if(i!=null)play(0,i);if(!S.cpuDone){cpuAct();S.cpuDone=true}
	draw_();const had=await runAnn();if(had)await sleep(700);resolve();await runAnn()}
	function useful(k){const v=S.val;return k=='through'?v[0]>v[1]:k=='counter'||k=='offside'?v[0]<v[1]:k=='save'?S.ball==1:k=='yellow'?!S.yel[1]:k=='red'?!S.red[1]&&!S.redN[1]:true}
	function chips(i){const a=[];if(S.redN[i])a.push('🟥 Capped from next turn');else if(S.red[i]>0)a.push(`🟥 Max 3 · ${S.red[i]} turn${S.red[i]>1?'s':''}`);if(S.yel[i])a.push('🟨 Next win cancelled');return a.map(t=>`<span class="chip">${t}</span>`).join('')}
	function draw_(){if(S.mp&&!NET.g)NET.sync();const q=id=>document.getElementById(id),fx=S.fx;S.fx=null;if(selC!=null&&(S.phase!='cards'||selC>=S.hand[0].length))selC=null;
	q('s0').textContent=`${D[0]} ${S.sc[0]}`;q('s1').textContent=`${S.sc[1]} ${D[1]}`;
	const P0=A[S.team[0]],P1=A[S.team[1]];
	const card=(i,P)=>`<button class="pc${i?'':' me'}${S.abUsed[i]?' used':''}${selD===i?' sel':''}" onclick="selD=selD===${i}?null:${i};draw_()" aria-label="${P[0]}, ${P[1]}. Tap for details"><span class="tag">${i?`${D[1].toUpperCase()} ▼ · 🃏${S.hand[1].length}`:'YOU ▲'}</span><span class="av" data-avatar="${S.team[i]}">${hd(S.team[i])}</span><b class="nm">${P[0]}</b><span class="role">${P[1]}</span><span class="abn">${P[3]?'⭐ ':''}${P[4].split(':')[0]}</span><span class="cost">${P[3]?'●'.repeat(P[2])+'○'.repeat(3-P[2]):'Passive'}</span></button>`;
	q('rail').innerHTML=card(1,P1)+card(0,P0);q('hlbl').textContent=`Your hand · ${S.hand[0].length}/${lim(0)}`;
	const need=P0[3]&&S.hand[0].length<P0[2],can=S.phase=='cards'&&!S.act&&!S.abUsed[0]&&!need;
	q('abar').innerHTML=`<div class="abrow"><div class="at"><b>${hd(S.team[0],"hd sm")} ${P0[0]}</b><span>${P0[3]?'⭐ ':'Passive: '}${P0[4].split(':')[0]}</span></div><div class="ar">${P0[3]?`<button class="ab" ${can?'':'disabled'} onclick="abilClick()">${S.abUsed[0]?'Used':'Use'} · discard ${P0[2]}</button>${need?`<small>Need ${P0[2]} cards</small>`:''}`:'<small>Passive</small>'}</div></div>`;
	const SP=selD==null?null:selD?P1:P0;q('pdesc').innerHTML=SP?`<b>${SP[0]}</b> · ${SP[4]}${SP[3]?' · discard '+SP[2]:' · passive'}`:'';
	q('chips').innerHTML=`<div>${chips(0)}</div><div>${chips(1)}</div>`;
	const pos=6-S.ball,hl=document.getElementById('hl'),bl=document.getElementById('ball');
	hl.style.top=pos*100/7+'%';bl.style.top=(pos+.5)*100/7+'%';
	if(lastBall!==S.ball){bl.classList.remove('kick');void bl.offsetWidth;bl.classList.add('kick')}lastBall=S.ball;{const on=S.phase!='over',hot=on&&S.ball==5,cold=on&&S.ball==1,al=q('alert'),fd=q('field');al.className='alert'+(hot?' hot':cold?' cold':'');al.textContent=hot?'⚽ Win this roll = GOAL for you!':cold?'🚨 Lose this roll = CPU scores!':'';fd.classList.toggle('hot',hot);fd.classList.toggle('cold',cold)}
	document.querySelectorAll('.gl').forEach((e,i)=>e.classList.toggle('on',i==pos));
	const pl=k=>k?`${C[k][3]} ${C[k][0]}`:'No card';
	const col=i=>{const none=!S.seen;let c='die'+(fx=='roll'?' roll':'')+(fx=='w'+i?' win':'')+(fx=='tie'?' tie':'');const pend=(S.phase=='cards'&&(S.mp?!S.acted[i]:(i?!S.cpuDone:!S.played[0])))||(S.hold&&i==1);
	return `<div class="dc"><div class="dn">${D[i]}</div><div class="${c}" aria-label="${D[i]} rolled ${none?'nothing':F[S.face[i]-1]}">${none?'–':F[S.face[i]-1]+`<small>${S.face[i]==6?'+ card':S.val[i]||''}</small>`}</div><div class="pl">${none?'':pend?'…':pl(S.played[i])}</div></div>`};
	q('dice').innerHTML=col(0)+'<div class="vs">VS</div>'+col(1);
	q('res').textContent=S.rv?`${S.rv[0]} vs ${S.rv[1]}: ${nm(S.rt)}`:'';
	q('info').textContent=S.phase=='cards'?(S.mp?(S.act?'Opponent is choosing a card…':'Your turn: tap a card, use your ability, or let the timer skip.'):S.info)+(S.peek?` 👁️ ${D[1]} holds: ${C[S.peek][0]}`:''):S.phase=='roll'?(S.seen?'Next turn':'Kick off: roll the die'):'';
	q('log').innerHTML=nm(logOpen?L.join('<br>'):(L[L.length-1]||''));q('logbtn').textContent=logOpen?'Hide':'History';q('logbtn').onclick=()=>{logOpen=!logOpen;draw_()};
	const g=q('go');g.style.display='';g.disabled=annBusy;g.className='main';g.onclick=roll;
	if(S.phase=='roll')g.textContent=S.seen&&S.val[0]==S.val[1]?'🎲 Tie: roll again':'🎲 Roll';
	else if(S.phase=='cards'){g.className='main tmr';g.onclick=()=>done(null);if(S.act)g.disabled=true;tUI()}
	else g.style.display='none';
	q('end').innerHTML=S.phase=='over'?`<div class="end"><h2>${S.sc[0]>S.sc[1]?'🏆 You win!':S.mp?'Opponent wins':'CPU wins'}</h2><div>Final score ${S.sc[0]} – ${S.sc[1]}</div><br>${NET.g?'<small>Waiting for the host to start a rematch…</small>':'<button class="main" onclick="again()">Play again</button>'}</div>`:'';
	const hn=lim(0),old=prevN;prevN=S.hand[0].length;q('hand').style.setProperty('--n',hn);
	q('hand').innerHTML=S.phase=='over'?'':Array.from({length:hn},(_,i)=>{const k=S.hand[0][i],a=(i-(hn-1)/2)*7,dy=Math.abs(i-(hn-1)/2)*5,st=`--r:${a}deg;--y:${dy}px`;
	if(!k)return `<div class="hc ghost" style="${st}"></div>`;
	const u=S.phase!='cards'||useful(k);
	return `<button class="hc t-${CT[k]}${u?'':' dim'}${i>=old?' new':''}" style="${st}" ${S.phase=='cards'&&!S.act?'':'disabled'} aria-pressed="false" onclick="pickCard(${i})"><span class="hn">${C[k][0]}</span><span class="art">${C[k][3]}</span><span class="he">${C[k][1]}</span></button>`}).join('');
	selUI();
	q('flash').innerHTML=S.flash?`<span>${nm(S.flash)}</span>`:'';S.flash=''}
	menu();
	</script></body></html>
